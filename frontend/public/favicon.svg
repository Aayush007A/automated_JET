<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C1E" />
      <stop offset="100%" stop-color="#0F2B2E" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3AD" />
      <stop offset="100%" stop-color="#007680" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86BC25" />
      <stop offset="100%" stop-color="#43B02A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Outer Protective Shield -->
  <path d="M32 10 L48 16 C48 30 40 44 32 50 C24 44 16 30 16 16 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Inner Geometric Facet -->
  <path d="M32 12 L46 17.5 C46 29.5 39 42 32 47.5 L32 12 Z" 
        fill="rgba(255,255,255,0.18)" />

  <!-- JET Checkmark / Core Assurance Vector -->
  <path d="M25 29 L30 34 L39 23" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Signature Deloitte Green Dot -->
  <circle cx="47" cy="47" r="4.5" fill="url(#glowGrad)" stroke="#021C1E" stroke-width="1.5" />
</svg>
